<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
</head>
<body>

<div th:fragment="selectedItem(pos)" class="container row m-0" style="height: fit-content !important;" th:id="'position_'+${pos.getId()}">

  <div class="position big col-7">
    <h5 th:text="${pos.getName()  }" ></h5>
    <span th:text="${pos.getPrice()} + ' грн'"></span>
    <div class="d-flex flex-column">
      <div class="weight">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-backpack" viewBox="0 0 16 16">
          <path d="M4.04 7.43a4 4 0 0 1 7.92 0 .5.5 0 1 1-.99.14 3 3 0 0 0-5.94 0 .5.5 0 1 1-.99-.14M4 9.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5zm1 .5v3h6v-3h-1v.5a.5.5 0 0 1-1 0V10z"/>
          <path d="M6 2.341V2a2 2 0 1 1 4 0v.341c2.33.824 4 3.047 4 5.659v5.5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5V8a6 6 0 0 1 4-5.659M7 2v.083a6 6 0 0 1 2 0V2a1 1 0 0 0-2 0m1 1a5 5 0 0 0-5 5v5.5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5V8a5 5 0 0 0-5-5"/>
        </svg>
        <i >0 г</i>
<!--        <i th:text="${pos.getWeight()} + ' г'"></i>-->
      </div>

      <div class="amount-selector">
        <div class="btn btn-outline-warning disable-dbl-tap-zoom"  th:onclick="'addAmount(' + ${pos.getId()} + ',-1)'">-</div>
        <span class="amount" th:class="'sel_pos_'+${pos.getId()}" th:text="${pos.getAmount()}" th:id="'sel_pos_'+${pos.getId()}"></span>
        <div class="btn btn-outline-warning disable-dbl-tap-zoom" th:onclick="'addAmount(' + ${pos.getId()} + ',1)'">+</div>
      </div>
    </div>
  </div>
  <div class="d-flex flex-column buttons col-2 justify-content-center">
    <button class="btn btn-outline-danger m-0" th:onclick="'remove('+${pos.getId()}+')'">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-x" viewBox="0 0 16 16">
        <path d="M6.146 6.146a.5.5 0 0 1 .708 0L8 7.293l1.146-1.147a.5.5 0 1 1 .708.708L8.707 8l1.147 1.146a.5.5 0 0 1-.708.708L8 8.707 6.854 9.854a.5.5 0 0 1-.708-.708L7.293 8 6.146 6.854a.5.5 0 0 1 0-.708"/>
        <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1"/>
      </svg>
    </button>
  </div>

</div>

</body>
</html>
