<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/asserts/styles/Order/header.css" rel="stylesheet"/>
    <link href="/asserts/styles/Order/page.css" rel="stylesheet"/>
    <link href="/asserts/styles/Order/categories.css" rel="stylesheet"/>
</head>
<body>
<header th:replace="header::header"></header>
<main>
    <div class="container rounded p-4" style="margin-top:10vh">
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-6 col-sm-12">
                <form method="POST" action="/pos-ings/generate">
                    <div class="mb-3">
                        <label class="form-label" for="categorySelect">
                            Оберіть категорію
                        </label>
                        <select class="form-control" id="categorySelect" name="categorySelect" style="color: black !important;">
                            <option th:each="category:${categories}" th:value="${category.getId()}" th:text="${category.getName()}" ></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <input class="btn btn-outline-success" type="submit" value="Генерувати" style="color:white !important;"/>
                    </div>
                </form>
            </div>

        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
