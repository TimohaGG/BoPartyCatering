
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="/asserts/styles/Order/header.css" rel="stylesheet"/>
  <link href="/asserts/styles/Order/page.css" rel="stylesheet"/>
  <link href="/asserts/styles/Order/categories.css" rel="stylesheet"/>

</head>
<body>

<header th:replace="header::header"></header>

<main>
  <div class="container rounded">

    <div class="row align-items-center justify-content-center">
      <div class="col-3 p-3 d-none d-lg-block mb-auto">
        <div class="ms-2 me-auto">
          <div class="fw-bold">Меню</div>
          <ul class="list-group">
            <li class="list-group-item" th:classappend="${category.getId() == currentCategory.getId() ? 'current' : ''}" th:each="category:${categories}" >
              <a th:href="'/positions?categoryId=' + ${category.getId()}" class="text-decoration-none" th:text="${category.getName()}"></a>
            </li>

          </ul>
        </div>
      </div>
      <div class="col-12 d-block d-lg-none" style="height: max-content">
        <div class="d-flex align-items-center scrollbar" style="overflow-x: auto;">
          <a th:href="'/positions?categoryId=' + ${category.getId()}" class="text-decoration-none mobile-menu-item" th:each="category:${categories}" th:text="${category.getName()}" th:classappend="${category.getId() == currentCategory.getId() ? 'current' : ''}"></a>
        </div>
      </div>

      <div class="col-lg-6 col-12 positions mb-4">
        <h2 class="categoryHead" style="background-color: #454545;" th:text="${currentCategory.getName()}"></h2>

        <div th:each="pos:${positions}" class="row align-items-center justify-content-center w-100 m-0" style="height: fit-content;" th:data-id="${pos.getId()}">

          <div class="position col-4">
            <h5 th:text="${pos.getName()}"></h5>

            <span th:text="${pos.getPrice()} + ' грн'"></span>
            <span th:text="${pos.getWeight()} + ' г'"></span>

          </div>
          <div class="col-4 text-center" >
            <img th:if="${pos.getImage()!=null}" th:src="'data:image/jpeg;base64,' + ${pos.getImageBase64()}" alt="image" style="max-height: 70px"/>

          </div>
          <div class="d-lg-flex d-sm-block text-center col-lg-4 col-sm-12 justify-content-end orderBtn">
            <a class="btn btn-outline-warning " th:href="'/create/position?posId='+${pos.getId()}" >
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pen" viewBox="0 0 16 16">
                <path d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001m-.644.766a.5.5 0 0 0-.707 0L1.95 11.756l-.764 3.057 3.057-.764L14.44 3.854a.5.5 0 0 0 0-.708z"/>
              </svg>
            </a>

            <button type="button" class="btn btn-outline-danger ms-3" data-bs-toggle="modal" data-bs-target="#deleteModal" th:data-id="${pos.getId()}">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-x" viewBox="0 0 16 16">
                <path d="M6.146 6.146a.5.5 0 0 1 .708 0L8 7.293l1.146-1.147a.5.5 0 1 1 .708.708L8.707 8l1.147 1.146a.5.5 0 0 1-.708.708L8 8.707 6.854 9.854a.5.5 0 0 1-.708-.708L7.293 8 6.146 6.854a.5.5 0 0 1 0-.708"/>
                <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1"/>
              </svg>
            </button>

          </div>

        </div>

      </div>
      <div class="col-3 d-none d-lg-block mb-auto">

      </div>
<!--      <nav aria-label="Page navigation example">-->
<!--        <ul class="pagination justify-content-center">-->
<!--          <li class="page-item disabled">-->
<!--            <a class="page-link">Previous</a>-->
<!--          </li>-->
<!--          <li class="page-item"><a class="page-link" href="#">1</a></li>-->
<!--          <li class="page-item"><a class="page-link" href="#">2</a></li>-->
<!--          <li class="page-item"><a class="page-link" href="#">3</a></li>-->
<!--          <li class="page-item">-->
<!--            <a class="page-link" href="#">Next</a>-->
<!--          </li>-->
<!--        </ul>-->
<!--      </nav>-->

    </div>

  </div>

  <div class="modal fade" style="background-color: rgba(0, 0, 0, 0.5);" id="deleteModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="deleteModalLabel">Видалити позицію?</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <span>
            Вона буде видалена з усіх замовлень!
          </span>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Ні</button>
          <button class="btn btn-outline-danger" onclick="deletePosition()">
            Так, видалити позицію
          </button>
          <input type="hidden" id="pos-id"/>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<script>
  async function deletePosition() {
    let elem = document.getElementById("pos-id");
    let id = elem.value;
    if(id!=null){
      const response = await fetch('/position/remove/'+id, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      })
              .then(response => response.text())
              .then(response => {
                document.querySelector(`[data-id='${id}']`).remove();
                var deleteModal = document.getElementById("deleteModal");
                var modalInstance = bootstrap.Modal.getInstance(deleteModal); // Get the modal instance
                modalInstance.hide(); // Hide the modal

              })
              .catch(error => console.log(error));
    }


  }


  let modal = document.getElementById('deleteModal');
  modal.addEventListener('show.bs.modal', function (event) {
    let button = event.relatedTarget;
    let id = button.dataset.id;

    let elem = document.getElementById("pos-id");
    elem.value = id;
  });
</script>
</body>
</html>
