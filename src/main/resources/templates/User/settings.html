
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/asserts/styles/Order/header.css" rel="stylesheet"/>
    <link href="/asserts/styles/Order/page.css" rel="stylesheet"/>
    <link href="/asserts/styles/Order/categories.css" rel="stylesheet"/>

</head>
<body>

<header th:replace="header::header"></header>

<main style="position: relative">
    <div class="container rounded">

        <div class="row align-items-center pt-2" style="justify-content: space-around;height: 100vh">
            <div class="col-sm-12 col-lg-6 positions mb-4" style="overflow-y: scroll;overflow-x: hidden;height: 100%">
                <ul class="list-group">
                    <li class="list-group-item">
                        <a href="/oauth2/authorize" class="text-decoration-none btn btn-outline-danger w-100" th:if="${!authorized}">
                            Увійти з   <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg"/>
                        </a>
                        <a href="/oauth2/logout" class="text-decoration-none btn btn-outline-danger w-100" th:if="${authorized}">
                            Змінити акаунт
                        </a>

                    </li>
                    <li class="list-group-item" th:if="${authorized}">
                        <label class="form-label">Календар за замовчуванням</label>
                        <select name="calendarSelect" id="calendarSelect" onchange="changeDefColor()" class="form-select rounded-input" >
                            <option th:each="cal:${calendars}" th:text="${cal.getSummary()}" th:value="${cal.getId()}" th:selected="${defCalendar.equals(cal.getId())}"></option>
                        </select>
                    </li>
                </ul>
            </div>

        </div>

    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    async function changeDefColor(){
        let value = document.getElementById("calendarSelect").value;
        let resp = await fetch("/user/changeDefCalendar?calendar=" + value,{
            method:"GET"
        })
            .then(res=>res.text())
            .then(resp=>{

            })
            .catch(error=>console.log(error));
    }
</script>

</body>
</html>
