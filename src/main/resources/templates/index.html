
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3" style="overflow: hidden;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/asserts/styles/Order/header.css" rel="stylesheet"/>
    <link href="/asserts/styles/Order/page.css" rel="stylesheet"/>
    <link href="/asserts/styles/Order/categories.css" rel="stylesheet"/>

</head>
<body  style="overflow: hidden;padding: 0 !important;" class="p-0">

<header th:replace="header::header"></header>

<main style="position: relative">







    <div class="row" id="shoppingFormBtnsMobile" style=" display: none;z-index: 100">
        <div class="col-8">
            <form  method="get"  action="/order/shopping/collect" id="shoppingFormMobile">
                <button type="submit" class="btn btn-light" style="color: black !important;border-radius: 20px" >
                    Прорахувати
                </button>
            </form>
        </div>
        <div class="col-4" >
            <button class="btn btn-danger" onclick="toggleCheckboxesMobile()" id="backMobile">-</button>
        </div>
    </div>


    <button class="btn btn-light d-lg-none d-sm-block" type="button" id="shoppingBtnMobile"
            style="z-index: 100;position: absolute;bottom: 20%;right:3%;border-radius: 50%;height: 50px;width: 50px;color: black !important;"
            onclick="toggleCheckboxesMobile()">
        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="black" class="bi bi-card-checklist" viewBox="0 0 16 16">
            <path d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2z"/>
            <path d="M7 5.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m-1.496-.854a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 1 1 .708-.708l.146.147 1.146-1.147a.5.5 0 0 1 .708 0M7 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m-1.496-.854a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 0 1 .708-.708l.146.147 1.146-1.147a.5.5 0 0 1 .708 0"/>
        </svg>
    </button>

    <div class="container rounded" style="position: relative">


        <button data-bs-toggle="offcanvas" data-bs-target="#tempPositions" class="btn btn-light" style="color: black !important;position: absolute;right: 0;bottom: 50%;height: 50px;transform: translateX(25%)"  id="offBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="20" fill="black" class="bi bi-arrow-bar-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M12.5 15a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 1 0v13a.5.5 0 0 1-.5.5M10 8a.5.5 0 0 1-.5.5H3.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L3.707 7.5H9.5a.5.5 0 0 1 .5.5"/>
            </svg>
        </button>
        <div class="row align-items-center justify-content-center" style="overflow: hidden">


            <div class="col-3 p-3 d-none d-lg-block mb-auto">
                <ul class="list-group text-decoration-none">
                    <li class="list-group-item d-flex justify-content-between align-items-start">
                        <div class="ms-2 me-auto">
                            <ul class="list-group">
                                <li class="list-group-item"><a href="/create/order" class="text-decoration-none">Нове замовлення</a></li>
                            </ul>
                            <hr/>
                            <ul class="list-group">
                                <li class="list-group-item">
                                    <a href="/positions" class="btn text-decoration-none">Позиції</a>
                                    <a href="/create/position" class="btn btn-outline-light">+</a>
                                </li>
                                <li class="list-group-item">
                                    <button type="button" class="btn text-decoration-none" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                                        Нова категорія
                                    </button>
                                </li>
                                <li class="list-group-item"><a href="#" class="btn text-decoration-none">Новий інгредієнт</a></li>

                                <li class="list-group-item" id="shoppingToggleBtn" >
                                    <button class="btn btn-outline-light w-100"  onclick="toggleCheckboxes()">
                                         Закупівля
                                    </button>

                                </li>

                                <li class="list-group-item" style="display: none;" id="shoppingFormBtns">
                                    <div class="row">
                                        <div class="col-8">
                                            <form  method="get"  action="/order/shopping/collect" id="shoppingForm">
                                                <button type="submit" class="btn btn-outline-success" >
                                                    Прорахувати
                                                </button>
                                            </form>
                                        </div>
                                        <div class="col-4" >
                                            <button class="btn btn-outline-danger" onclick="toggleCheckboxes()">-</button>
                                        </div>
                                    </div>

                                </li>
                            </ul>
                            <hr/>
                            <ul class="list-group">
                                <li class="list-group-item"><a href="#" class="text-decoration-none">Аналітика</a></li>
                            </ul>
                        </div>
                    </li>

                </ul>
            </div>

            <div class="col-lg-5 col-12 positions mb-4 mx-1">

                <h2 class="categoryHead" style="background-color: #454545;">Замовлення</h2>
                <div th:each="order:${orders}" class="order_block row align-items-center justify-content-center w-100 m-0" style="height: fit-content;">
                    <div class="col-12">
                        <div class="row align-items-center ">
                            <div class="col-1 select-check"  style="visibility: hidden">
                                <input type="checkbox" style="transform: scale(2);display: none" name="orderIds[]" id="orderIds" form="shoppingForm" th:value="${order.getId()}" class="orderIds"/>
                                <input type="checkbox" style="transform: scale(2);display: none" name="orderIds[]" id="orderIdsMobile" form="shoppingFormMobile" th:value="${order.getId()}" class="orderIdsMobile"/>
                            </div>


                            <div class="position col-6">
                                <h4 th:if="${order.getClient()}!=''" >
                                    <a th:text="${order.getClient()}" th:href="'/order/view/'+${order.getId()}" class="text-decoration-none"></a>
                                </h4>
                                <h4 th:unless="${order.getClient()}!=''">-</h4>
                                <span th:text="${order.getPrice()}"></span>

                            </div>
                            <div class="col-5 text-center" >
                                <span th:text="${order.getDateFormatted()}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="d-lg-flex d-sm-block text-center col-12 justify-content-center orderBtn">

                        <a class="btn btn-outline-warning" th:href="'/edit/order/'+${order.getId()}" >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pen" viewBox="0 0 16 16">
                                <path d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001m-.644.766a.5.5 0 0 0-.707 0L1.95 11.756l-.764 3.057 3.057-.764L14.44 3.854a.5.5 0 0 0 0-.708z"/>
                            </svg>
                        </a>

                        <a class="btn btn-outline-primary ms-2" th:href="'/order/shopping/'+${order.getId()}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-basket3" viewBox="0 0 16 16">
                                <path d="M5.757 1.071a.5.5 0 0 1 .172.686L3.383 6h9.234L10.07 1.757a.5.5 0 1 1 .858-.514L13.783 6H15.5a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H.5a.5.5 0 0 1-.5-.5v-1A.5.5 0 0 1 .5 6h1.717L5.07 1.243a.5.5 0 0 1 .686-.172zM3.394 15l-1.48-6h-.97l1.525 6.426a.75.75 0 0 0 .729.574h9.606a.75.75 0 0 0 .73-.574L15.056 9h-.972l-1.479 6z"/>
                            </svg>

                        </a>

                        <a class="btn btn-outline-success ms-2" th:href="'/order/copy/' + ${order.getId()}" >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-copy" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"/>
                            </svg>
                        </a>


                        <a class="btn btn-outline-danger ms-2" th:href="'/order/remove/' + ${order.getId()}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-x" viewBox="0 0 16 16">
                                <path d="M6.146 6.146a.5.5 0 0 1 .708 0L8 7.293l1.146-1.147a.5.5 0 1 1 .708.708L8.707 8l1.147 1.146a.5.5 0 0 1-.708.708L8 8.707 6.854 9.854a.5.5 0 0 1-.708-.708L7.293 8 6.146 6.854a.5.5 0 0 1 0-.708"/>
                                <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1"/>
                            </svg>

                        </a>
                    </div>

                </div>




            </div>
            <div class="col-3 d-none d-lg-flex mb-auto flex-column align-items-center positions" >
                <h4 class="categoryHead w-100" style="background-color: #454545;">Об'єднані закупівлі</h4>

                <div th:each="order:${tempOrders}" class="row align-items-center justify-content-center w-100 m-0 " style="height: fit-content;">
                    <div class="col-12 position" style="height: fit-content;">
                        <h4 class="text-center">
                            <a th:text="${order.getClient()}" th:href="'/order/view/'+${order.getId()}" class="text-decoration-none"></a>
                        </h4>
                    </div>

                    <div class="d-lg-flex d-sm-block text-center col-12 justify-content-center orderBtn" style="height: fit-content;">

                        <a class="btn btn-outline-primary ms-2" th:href="'/order/shopping/'+${order.getId()}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-basket3" viewBox="0 0 16 16">
                                <path d="M5.757 1.071a.5.5 0 0 1 .172.686L3.383 6h9.234L10.07 1.757a.5.5 0 1 1 .858-.514L13.783 6H15.5a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H.5a.5.5 0 0 1-.5-.5v-1A.5.5 0 0 1 .5 6h1.717L5.07 1.243a.5.5 0 0 1 .686-.172zM3.394 15l-1.48-6h-.97l1.525 6.426a.75.75 0 0 0 .729.574h9.606a.75.75 0 0 0 .73-.574L15.056 9h-.972l-1.479 6z"/>
                            </svg>
                        </a>
                        <a class="btn btn-outline-danger ms-2" th:href="'/order/remove/' + ${order.getId()}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-x" viewBox="0 0 16 16">
                                <path d="M6.146 6.146a.5.5 0 0 1 .708 0L8 7.293l1.146-1.147a.5.5 0 1 1 .708.708L8.707 8l1.147 1.146a.5.5 0 0 1-.708.708L8 8.707 6.854 9.854a.5.5 0 0 1-.708-.708L7.293 8 6.146 6.854a.5.5 0 0 1 0-.708"/>
                                <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1"/>
                            </svg>
                        </a>
                    </div>

                </div>


            </div>
        </div>

    </div>

    <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form method="post" action="#" onsubmit="return false;">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="addCategoryModalLabel">Додати категорію</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" name="categoryName" id="categoryName" placeholder="Назва" class="form-control"/>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Назад</button>
                    <button type="submit" class="btn btn-outline-light" onclick="addCategory()">Додати</button>
                </div>
                </form>
            </div>
        </div>
    </div>


    <div class="offcanvas offcanvas-end" tabindex="-1" id="tempPositions" aria-labelledby="offcanvasRightLabel" style="background-color: #202020">

        <div class="offcanvas-body d-lg-flex mb-auto flex-column align-items-center positions pt-0">
            <button type="button" class="btn btn-outline-light" data-bs-dismiss="offcanvas" aria-label="Close" style="position: absolute;top:50%;left:3%;height: 50px" onclick="function deletePadding() {
                document.getElementsByTagName('body').item(0).style.padding = '0';
            }
            deletePadding()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-bar-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M6 8a.5.5 0 0 0 .5.5h5.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L12.293 7.5H6.5A.5.5 0 0 0 6 8m-2.5 7a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 1 0v13a.5.5 0 0 1-.5.5"/>
                </svg>
            </button>
            <h4 class="categoryHead w-100" style="background-color: #454545;">Об'єднані закупівлі</h4>

            <div th:each="order:${tempOrders}" class="row align-items-center justify-content-center w-100 m-0 " style="height: fit-content;">
                <div class="col-12 position" style="height: fit-content;">
                    <h4 class="text-center">
                        <a th:text="${order.getClient()}" th:href="'/order/view/'+${order.getId()}" class="text-decoration-none"></a>
                    </h4>
                </div>

                <div class="d-lg-flex d-sm-block text-center col-12 justify-content-center orderBtn" style="height: fit-content;">

                    <a class="btn btn-outline-primary ms-2" th:href="'/order/shopping/'+${order.getId()}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-basket3" viewBox="0 0 16 16">
                            <path d="M5.757 1.071a.5.5 0 0 1 .172.686L3.383 6h9.234L10.07 1.757a.5.5 0 1 1 .858-.514L13.783 6H15.5a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H.5a.5.5 0 0 1-.5-.5v-1A.5.5 0 0 1 .5 6h1.717L5.07 1.243a.5.5 0 0 1 .686-.172zM3.394 15l-1.48-6h-.97l1.525 6.426a.75.75 0 0 0 .729.574h9.606a.75.75 0 0 0 .73-.574L15.056 9h-.972l-1.479 6z"/>
                        </svg>
                    </a>
                    <a class="btn btn-outline-danger ms-2" th:href="'/order/remove/' + ${order.getId()}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-x" viewBox="0 0 16 16">
                            <path d="M6.146 6.146a.5.5 0 0 1 .708 0L8 7.293l1.146-1.147a.5.5 0 1 1 .708.708L8.707 8l1.147 1.146a.5.5 0 0 1-.708.708L8 8.707 6.854 9.854a.5.5 0 0 1-.708-.708L7.293 8 6.146 6.854a.5.5 0 0 1 0-.708"/>
                            <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1"/>
                        </svg>
                    </a>
                </div>

            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    async function addCategory(event){

        let name = document.getElementById("categoryName").value;
        if(name!==""){
            let resp = await fetch("/category/add?categoryName="+name,{
                method:"POST"
            })
                .then(resp=>resp.text())
                .then(resp=>{
                    document.getElementById('addCategoryModal').classList.remove('show');
                    document.getElementById('addCategoryModal').style.display = 'none';
                    document.body.classList.remove('modal-open');
                    document.querySelector('.modal-backdrop').remove();

                })
                .catch(error=>console.log(error));
        }

    }

    function toggleCheckboxes() {
        document.querySelectorAll('.select-check').forEach(element => element.style.visibility = element.style.visibility==='hidden' ? 'visible' : 'hidden');

        document.querySelectorAll(".orderIds").forEach(input => input.style.display= input.style.display==='none' ? 'block' : 'none');


        let form = document.getElementById('shoppingFormBtns');
        form.style.display = form.style.display==='none' ? 'block' : 'none';

        let btn = document.getElementById('shoppingToggleBtn');
        btn.style.display = btn.style.display==='none' ? 'block' : 'none';
    }

    function toggleCheckboxesMobile() {
        // document.querySelectorAll('.select-check').forEach(element => element.style.visibility = element.style.visibility==='hidden' ? 'visible' : 'hidden');
        document.querySelectorAll('.select-check').forEach(element => element.style.visibility = element.style.visibility==='hidden' ? 'visible' : 'hidden');
        document.querySelectorAll(".orderIdsMobile").forEach(input => input.style.display= input.style.display==='none' ? 'block' : 'none');

        let form = document.getElementById('shoppingFormBtnsMobile');
        form.style.display = form.style.display==='none' ? 'flex' : 'none';

        let btn = document.getElementById('shoppingBtnMobile');
        btn.style.display = btn.style.display==='none' ? 'block' : 'none';
    }

    // document.getElementById("offBtn").addEventListener("onclick", ()=>{
    //     document.getElementById("offBtn").dataset.padding
    // });

    $(document.body).on('hidden.bs.modal', function () {
        $('body').css('padding-right','0');
    });
</script>

</body>
</html>
