<head>

<body>

<header th:replace="header::header"></header>

<main style="overflow:hidden;position: relative">
    <button class="btn btn-outline-light d-sm-block d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation" style="position: absolute;bottom:20%;right:8%;border-radius: 50%;width: 50px;height: 50px;z-index: 1000">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-basket-fill" viewBox="0 0 16 16">
            <path d="M5.071 1.243a.5.5 0 0 1 .858.514L3.383 6h9.234L10.07 1.757a.5.5 0 1 1 .858-.514L13.783 6H15.5a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5H15v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9H.5a.5.5 0 0 1-.5-.5v-2A.5.5 0 0 1 .5 6h1.717zM3.5 10.5a.5.5 0 1 0-1 0v3a.5.5 0 0 0 1 0zm2.5 0a.5.5 0 1 0-1 0v3a.5.5 0 0 0 1 0zm2.5 0a.5.5 0 1 0-1 0v3a.5.5 0 0 0 1 0zm2.5 0a.5.5 0 1 0-1 0v3a.5.5 0 0 0 1 0zm2.5 0a.5.5 0 1 0-1 0v3a.5.5 0 0 0 1 0z"/>
        </svg>
    </button>
    <div class="container rounded">

        <div class="row align-items-center justify-content-between">
            <div class="col-lg-7 col-12 positions mt-3 pb-5" style="align-self: flex-start; height: 89vh">
                <h2 class="categoryHead" style="background-color: #454545;">Закупівля</h2>

                <div th:each="shoppingItem : ${ingredients}" style="box-sizing: content-box; height: auto !important;">
                    <h3 th:text="${shoppingItem.getKey()}"></h3>
                    <ul class="list-group">
                        <li class="list-group-item p-3" th:each="item:${shoppingItem.getValue()}">
                            <div class="row">
                                <div class="col-6">
                                    <input type="checkbox" th:checked="${item.isBought()}" th:data-id="${item.getId()}" th:onclick="'changeState('+${item.getId()}+',event)'" style="transform: scale(2)"/>
                                    <span class="ms-3" th:text="${item.getIngredient().getIngredient().getName()}"></span>
                                </div>
                                <div class="col-4">
                                    <span th:text="${item.getIngredient().getAmount()} + ' ' + ${item.getIngredient().getUnit().getUnitName()}"></span>
                                </div>
                                <div class="col-2">
                                    <div th:if="${item.getComment() != null}">
                                        <button type="button"   data-bs-container="body" data-bs-toggle="popover" data-bs-placement="left" data-bs-html="true"
                                                th:data-bs-content="${item.getComment()}"
                                                onclick="preventCheck(event)" class="btn btn-outline-primary">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-info-circle" viewBox="0 0 16 16">
                                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                                <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
                                            </svg>
                                        </button>
                                        <button class="btn btn-outline-danger" th:onclick="'removeComment(event, '+${item.getId()}+')'">
                                            x
                                        </button>
                                    </div>

                                    <button th:unless="${item.getComment() != null}" class="btn btn-outline-light" onclick="preventCheck(event)" data-bs-toggle="modal" th:data-bs-target="'#addCommentModal_'+${item.getId()}">
                                        +
                                    </button>

                                    <div class="modal fade" th:id="'addCommentModal_'+${item.getId()}" tabindex="-1" th:aria-labelledby="'addCommentModalLabel_'+${item.getId()}" aria-hidden="true">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h1 class="modal-title fs-5" th:id="'addCommentModalLabel_'+${item.getId()}">Додати коментар</h1>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="preventCheck(event)"></button>
                                                </div>
                                                <div class="modal-body">
                                                    <label th:for="'comment_'+${item.getId()}">
                                                        Коментар
                                                    </label>
                                                    <textarea class="form-control" rows="3" th:id="'comment_'+${item.getId()}" name="comment" onclick="preventCheck(event)" style="color:black !important;"></textarea>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрити</button>
                                                    <button type="button" class="btn btn-primary" th:onclick="'addComment(event,'+${item.getId()}+')'">Додати</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>


                        </li>
                    </ul>
                </div>




            </div>

                <div class="offcanvas-header">

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".list-group-item").forEach(li => {
            li.addEventListener("click", function (event) {
                if(event.target.tagName!=="INPUT"){
                    const checkbox = li.querySelector("input[type='checkbox']");
                    if (checkbox) {

                        changeState(checkbox.dataset.id,checkbox);
                    }
                }

            });
        });
    });


    async function changeState(id, checkbox){
        if(checkbox instanceof PointerEvent)
            checkbox.preventDefault();
        let resp = await fetch("/order/shopping/changeState/"+id,{
            method:"POST"
        })
            .then(resp=>resp.text())
            .then(resp=>{
                console.log(resp);

                if(checkbox instanceof PointerEvent){
                    checkbox.target.checked = resp==="true";
                }
                else{
                    checkbox.checked = resp==="true";
                }

            });
    }


    async function checkState(){
        let resp = await fetch("/order/shopping/getState/"+[[${shoppingList.getId()}]],{
            method:"POST"
        })
            .then(resp=>resp.json())
            .then(resp=>{
                let arr = Array.from(resp);
                console.log(arr);
                document.querySelectorAll("[data-id]").forEach(el=>{
                    el.checked = arr.includes(+el.dataset.id);
                });
            })
    }
    setInterval(checkState,10000);
    const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')
    const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl))
    function preventCheck(event){
        event.stopPropagation();
        console.log(event);
    }

    async function addComment(event, shoppingItemId){
        event.stopPropagation();
        let text = document.getElementById("comment_"+shoppingItemId).value;
        if(text===""){
            return;
        }
        let res = await fetch("/order/shopping/"+shoppingItemId+"/addComment?comment="+text,{
            method:"POST",
        })
            .then(resp=>resp.text())
            .then(resp=>{
                console.log(resp);
            }).catch(error =>{
                console.log(error);
            });


    }

    async function removeComment(event, shoppingItemId){
        event.stopPropagation();
        let res = await fetch("/order/shopping/"+shoppingItemId+"/removeComment",{
            method:"POST"
        })
            .then(resp=>resp.text())
        .then(resp=>{
            console.log(resp);
        })
            .catch(error =>{
                console.log(error);
            });
    }
</script>
