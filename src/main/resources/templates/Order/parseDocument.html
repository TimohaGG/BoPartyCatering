<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" style="overflow-y: hidden;position:relative">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/asserts/styles/Order/header.css" rel="stylesheet"/>
    <link href="/asserts/styles/Order/page.css" rel="stylesheet"/>
    <link href="/asserts/styles/Order/categories.css" rel="stylesheet"/>
</head>
<body style="position: relative">

    <header th:replace="header::header"></header>

    <div class="row justify-content-center align-items-center">
        <form method="post" enctype="multipart/form-data" class="col-3">
            <div class="mb-3">
                <label for="menu">Меню:</label>
                <input class="form-control" type="file" name="menu" id="menu">
            </div>
            <div class="mb-3">
                <input type="submit" name="submit" class="btn btn-outline-light" id="submit">
            </div>
        </form>

    </div>


</body>
</html>
