<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" style="overflow-y: hidden;position:relative">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/asserts/styles/Order/header.css" rel="stylesheet"/>
    <link href="/asserts/styles/Order/page.css" rel="stylesheet"/>
    <link href="/asserts/styles/Order/categories.css" rel="stylesheet"/>
</head>
<body style="position: relative">

<header th:replace="header::header"></header>


<div class="container rounded mt-3" style="background-color: #454545">
    <div class="row justify-content-center align-items-center">
        <div class="col-sm-12 col-lg-6">
            <ul class="list-group errors-list">
                <li class="list-group-item mb-3 error-item" th:each="error:${errors}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="red" class="bi bi-x" viewBox="0 0 16 16">
                        <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                    </svg>
                    <span th:text="${error}"></span>
                </li>
            </ul>
        </div>
        <div class="col-12">

        </div>
        <div class="col-sm-12 col-lg-6 d-flex justify-content-around mb-3 mt-3">
            <a th:href="'/order/view/'+${orderId}" class="btn btn-outline-success">До замовлення</a>
            <a th:href="'/'" class="btn btn-outline-primary ">На головну</a>
        </div>
    </div>
</div>


</body>
</html>
