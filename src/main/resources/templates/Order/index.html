<body>

<header th:replace="header::header"></header>

<main style="position: relative">
    <div class="container rounded" style="margin-bottom: 50px">
        <div class="row align-items-center pt-3     preview" style="justify-content: space-around;height: 100vh; padding-bottom: 100px">
            <div class="col-3 p-3 mt-3 d-none d-lg-block mb-auto" style="position: sticky;top:0;">
                <ul class="list-group">
                    <li class="list-group-item">
                        <b>Замовник: </b><br/><span th:text="${order.getClient()}"></span>
                    </li >
                    <li class="list-group-item"><b>Дата: </b><br/><span th:text="${order.getDate()}"></span></li>
                    <li class="list-group-item"> <b>Початок заходу: </b><br/><span th:text="${order.getDate()}"></span></li>
                    <li class="list-group-item"> <b>Тривалість: </b><br/><span th:text="${order.getDuration()}"></span></li>
                    <li class="list-group-item"> <b>К-сть запрошених: </b><br/><span th:text="${order.getGuestsAmount()}"></span></li>
                    <li class="list-group-item"> <b>Формат: </b><br/><span th:text="${order.getFormat()}"></span></li>
                    <li class="list-group-item"> <b>Телефон відповідального: </b><br/><span th:text="${order.getPhone()}"></span></li>

                </ul>
            </div>

            <div class="col-lg-8 col-12 positions mb-4" style="overflow-y: scroll;overflow-x: hidden;height: 100%">
                <h2 class="categoryHead" style="background-color: #454545;" th:if="${order.getDate()==null}" th:text="${order.getDate()}"></h2>
                <h2 class="categoryHead" style="background-color: #454545;" th:unless="${order.getDate()==null}" th:text="${order.getClient()}"></h2>

                <table class="table table-hover table-dark">
                    <tr th:each="position:${order.getPositionsAmount()}">
                        <td class="text-center">
                            <img th:if="${!position.getPosition().getImageBase64().isEmpty()}" th:src="'data:image/jpeg;base64,' + ${position.getPosition().getImageBase64()}" alt="photo" style="max-height: 70px"/>
                        </td>
                        <td>
                            <h5 th:text="${position.getPosName()}"></h5>
                            <span th:text="${position.getPosition().getPriceInt()} + ' грн/шт'"></span>
                        </td>
                        <td class="d-none d-sm-none d-md-table-cell d-lg-table-cell d-xl-table-cell">
                            <span th:text="${position.getPosition().getWeight()} + ' г'"></span>
                        </td>
                        <td class="d-none d-sm-none d-md-table-cell d-lg-table-cell">
                            <span th:text="${position.getAmount()} + ' шт'"></span>
                        </td>

                        <td class="d-table-cell d-md-none d-lg-none" colspan="2">
                            <span th:text="${position.getAmount()} + ' шт'"></span>
                        </td>
                    </tr>

                    <tr>
                        <td>Загальна ціна:</td>
                        <td th:text="${order.getPrice()} + ' грн'" colspan="3"></td>
                    </tr>
                    <tr th:each="info:${order.getAdditionalInfo()}">
                        <td th:text="${info.getTitle()}" ></td>

                        <td th:if="${info.getImageBase64()!=''}" >
                            <img alt="image"  th:src="'data:image/jpeg;base64,' + ${info.getImageBase64()}" style="max-height: 80px"/>
                        </td>

                        <td th:colspan="${info.getImageBase64()!='' ? 1 : 2}">
                            <span th:text="${info.getDescription()}"></span><br>
                            <span th:text="${info.getPrice()} + ' грн'"></span>
                        </td>
                        <td>
                            <form method="post" th:action="'/order/deleteInfo/'+${info.getId()}">
                                <input type="hidden" name="orderId" id="orderId" th:value="${order.getId()}"/>
                                <input type="submit" style="width: fit-content;color: white !important;" class="text-decoration-none btn btn-outline-danger" value="x"/>
                            </form>
                        </td>
                    </tr>
                    <tr>

                        <td colspan="4" class="text-center">
                            <button type="button" class="btn btn-outline-light w-100 " data-bs-toggle="modal" data-bs-target="#addModal">
                                +
                            </button>
                            <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <form  method="post" th:action="'/order/addinfo/'+${order.getId()}" th:object="${info}" enctype="multipart/form-data" id="addInfoForm">
                                            <div class="modal-header" style="background-color: #454545">
                                                <h1 class="modal-title fs-5" id="addModalLabel">Modal title</h1>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body" style="background-color: #202020">

                                                    <label class="form-label" for="infoTemplate">Шаблон</label>
                                                    <select class="form-select" id="infoTemplate" name="infoTemplate" style="color: black !important;" onchange="func()">
                                                        <option value="0" th:text="'-'"></option>
                                                        <option  th:each="inf:${common}" th:value="${inf.getId()}" th:text="${inf.getTitle()}" ></option>
                                                    </select>
                                                </div>
                                                <div class="mb-3">
                                                    <label for="title" class="form-label">Заголовок</label>
                                                    <input type="text" name="title" id="title" class="form-control" th:field="*{title}" />
                                                </div>
                                                <div class="mb-3">
                                                    <label for="description"  class="form-label">Опис</label>
                                                    <input type="text" name="description" id="description" class="form-control" th:field="*{description}"/>
                                                </div>
                                                <div class="mb-3">

                                                    <input type="file" name="image" id="image" class="form-control" th:field="*{image}"/>
                                                </div>
                                                <div class="mb-3">
                                                    <label for="price"  class="form-label">Ціна</label>
                                                    <input type="number" name="price" id="price" class="form-control" th:field="*{price}"/>

                                                    <label for="price2"  class="form-label">Зберігти</label>
                                                    <input type="checkbox" name="price2" id="price2" class="form-check" th:field="*{save}"/>
                                                </div>


                                            </div>
                                            <div class="modal-footer" style="background-color: #454545">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Відмінити</button>
                                                <button type="submit" class="btn btn-primary">Зберегти</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </td>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>

    function toogleTax(event) {
        let id = event.target.id+"-amount";
        if (event.target.checked) {
            document.getElementById(id).style.visibility = "visible";
        }
        else {
            document.getElementById(id).style.visibility = "hidden";
        }
    }

    let selectedColor = "rgb(250,187,7)";
    function insertData(title, desc, price){
        console.log(title);
    }

    async function func(){
        let elem = document.getElementById("infoTemplate");
        let resp = await fetch("/info/get/"+elem.value,{
            method:"POST"
        })
            .then(resp=>resp.json())
            .then(resp=>{
                let titleElem = document.getElementById("title");
                let descriptionElem = document.getElementById("description");
                let priceElem = document.getElementById("price");
                if(resp){
                    titleElem.value = resp.title;
                    descriptionElem.value = resp.description;
                    priceElem.value = resp.price;
                }
            })
            .catch(error=>console.log(error));

    }

    async function appendColor(event){
        event.preventDefault();
        let form = event.target;
        let url = form.action;
        let color = selectedColor.replace("rgb(","").replace(")","");
        url += "?color=" + color.replace(" ","");

        await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        }).then(response => response.blob())
            .then(blob => {
                let link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "example.pdf";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }).catch(console.error);
        // form.submit();
        // form.action = form.action.split("?")[0];
    }

    function selectColor(event){
        console.log(event.target.previousElementSibling);
        if(event.target.previousElementSibling!==null&&event.target.previousElementSibling.tagName==="DIV"){
            event.target.previousElementSibling.classList.remove("selected");
        }
        else{
            console.log(event.target.nextElementSibling);
            event.target.nextElementSibling.classList.remove("selected");
        }
        event.target.classList.add("selected");
        let color = document.getElementById("color");
        color.value = event.target.style.backgroundColor.replace("rgb(","").replace(")","");
    }
</script>
